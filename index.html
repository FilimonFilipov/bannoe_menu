<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Банное меню — сегодня</title>
<style>
  :root{
    --green:#3F5E3A; --gold:#9C7A34; --dark:#2B2B2B; --grey:#6B6B6B;
    --bg:#FAF9F5; --card:#EDF2E6; --line:#E3DFD3; --soft:#EDF2E6;
    --tonus:#B5651D; --relax:#3E6E8E; --breath:#2E8B72; --skin:#B0416B; --neutral:#6B6B6B;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1E1E1A; --card:#2A2B24; --line:#3A3B33; --dark:#EDEAE0; --grey:#B9B6AA; --green:#8FBF86; --soft:#2F3A2B; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--dark);font-family:Georgia,'Times New Roman',serif;}
  body{padding:calc(18px + env(safe-area-inset-top,0px)) 14px 110px;max-width:640px;margin:0 auto;}
  h1{font-size:30px;letter-spacing:.02em;color:var(--green);text-align:center;margin:2px 0 4px;}
  .sub{text-align:center;color:var(--gold);font-style:italic;font-size:14px;margin-bottom:4px;}
  .updated{text-align:center;color:var(--grey);font-size:11px;margin-bottom:14px;min-height:14px;}
  .tabs{display:flex;gap:8px;margin:14px 0 10px;}
  .tab{flex:1;text-align:center;padding:9px;border-radius:8px;background:var(--card);color:var(--grey);font-size:14px;cursor:pointer;border:1px solid var(--line);}
  .tab.active{background:var(--green);color:#fff;border-color:var(--green);}
  .row{display:flex;align-items:stretch;gap:12px;margin-bottom:12px;}
  .ic{width:56px;flex-shrink:0;background:var(--soft);border-radius:4px;display:flex;align-items:center;justify-content:center;}
  .ic img{width:42px;height:42px;border-radius:3px;}
  .tx{flex:1;min-width:0;padding:2px 0;}
  .orn{text-align:center;color:var(--gold);font-size:16px;margin-top:4px;}
  .emo{font-style:normal;} .emo.calm{filter:saturate(.35) sepia(.45) brightness(.97);}
  .like{float:right;margin-left:8px;border:1px solid var(--line);background:transparent;border-radius:14px;padding:2px 9px;font-size:13px;color:var(--grey);cursor:pointer;font-family:inherit;}
  .addcard{border:2px dashed var(--line);border-radius:6px;text-align:center;padding:14px;color:var(--grey);cursor:pointer;margin:6px 0 14px;font-size:14px;}
  .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:none;justify-content:center;padding:16px;overflow:auto;z-index:20;}
  .modal.show{display:flex;}
  .mbox{background:var(--bg);border-radius:10px;padding:16px;max-width:560px;width:100%;margin:auto;}
  .mbox h3{margin:0 0 10px;color:var(--green);font-size:18px;}
  .mbox input[type=text],.mbox input[type=password],.mbox select,.mbox textarea{width:100%;font-family:inherit;font-size:14px;padding:8px;margin:4px 0 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--dark);}
  .mbox textarea{min-height:60px;resize:vertical;}
  .mbox label.lb{display:block;font-size:12px;color:var(--grey);margin-top:6px;}
  .mrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .mbox .prev{width:56px;height:56px;border-radius:4px;background:var(--soft);}
  .mbtn{border-radius:8px;padding:10px 14px;font-size:14px;font-family:Georgia,serif;cursor:pointer;}
  .delcustom{display:inline-block;margin-top:4px;font-size:11px;color:var(--grey);text-decoration:underline;cursor:pointer;}
  .lsteam{color:#2E6E5A;} .lotvar{color:#8A5A2E;}
  .row.off{opacity:.4;}
  .row input{width:22px;height:22px;flex-shrink:0;align-self:center;accent-color:var(--green);}
  .rname{font-weight:bold;color:var(--green);font-size:15px;}
  .rtag{font-size:10px;font-weight:bold;letter-spacing:.03em;margin-left:6px;}
  .rline{font-size:13.5px;margin:2px 0 0;line-height:1.4;}
  .rlabel{font-style:italic;color:var(--grey);}
  .toggleall{text-align:right;font-size:12px;color:var(--grey);margin:-4px 0 8px;cursor:pointer;text-decoration:underline;}
  .empty{text-align:center;color:var(--grey);padding:30px 0;font-style:italic;}
  .status{text-align:center;font-size:12px;color:var(--grey);margin-top:8px;min-height:16px;}
  .footerbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:8px;max-width:640px;margin:0 auto;}
  .footerbar button{border-radius:8px;padding:12px;font-size:14px;font-family:Georgia,serif;cursor:pointer;}
  .btn-main{flex:1;background:var(--green);color:#fff;border:none;font-size:15px;}
  .btn-main:disabled{opacity:.5;}
  .btn-sec{background:var(--card);color:var(--green);border:1px solid var(--green);}
  .login{text-align:center;margin-top:28px;font-size:11px;}
  .login a{color:var(--grey);cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
  <div class="orn">❦</div>
  <h1 id="title">БАННОЕ МЕНЮ</h1>
  <div class="sub" id="subtitle"></div>
  <div class="updated" id="updatedAt"></div>
  <div class="tabs">
    <div class="tab active" data-tab="veniki">Веники</div>
    <div class="tab" data-tab="travy">Травы</div>
  </div>
  <div class="toggleall" id="toggleAll" style="display:none;">отметить/снять всё</div>
  <div id="list"></div>
  <div class="status" id="status"></div>
  <div class="login" id="voteCfg" style="display:none;margin-top:10px;"><a id="voteCfgLink">настроить голосование (сердечки)</a></div>
  <div class="login" id="login"><a id="loginLink">вход для редакторов</a></div>

  <div class="footerbar" id="footerbar">
    <button class="btn-sec" id="previewBtn">Как у гостя</button>
    <button class="btn-main" id="saveBtn">Сохранить для всех</button>
    <button class="btn-sec" id="logoutBtn" title="Выйти из режима редактирования">Выйти</button>
  </div>

<div class="modal" id="loginModal"><div class="mbox">
  <h3>Вход для редакторов</h3>
  <label class="lb" id="lgLabel">Пароль</label>
  <input type="password" id="lgPass" autocomplete="current-password">
  <div class="mrow" style="margin-top:10px"><button class="mbtn btn-main" id="lgOk">Войти</button><button class="mbtn btn-sec" id="lgCancel">Отмена</button></div>
</div></div>

<div class="modal" id="addModal"><div class="mbox">
  <h3>Новый пункт меню</h3>
  <div class="mrow"><label><input type="radio" name="addCat" value="veniki" checked> Веник</label><label><input type="radio" name="addCat" value="travy"> Трава</label></div>
  <label class="lb">Название</label><input type="text" id="fName" placeholder="Например: Осиновый веник">
  <label class="lb">Для чего</label><select id="fTag"></select>
  <label class="lb">Рисунок (подбирается по названию, можно поменять)</label>
  <div class="mrow"><select id="fShape" style="flex:1"></select><img class="prev" id="fPrev" alt=""></div>
  <div class="mrow" style="margin:8px 0"><button class="mbtn btn-sec" id="fCopy">1. Скопировать запрос для Клода</button></div>
  <label class="lb">2. Вставьте сюда ответ Клода, поля ниже заполнятся сами</label>
  <textarea id="fPaste"></textarea>
  <button class="mbtn btn-sec" id="fParse">Разобрать текст</button>
  <label class="lb">Аромат</label><textarea id="fAroma"></textarea>
  <div id="fVen"><label class="lb">Действие</label><textarea id="fAction"></textarea></div>
  <div id="fTrav"><label class="lb">Пар</label><textarea id="fSteam"></textarea><label class="lb">Отвар</label><textarea id="fOtvar"></textarea></div>
  <div class="mrow" style="margin-top:10px"><button class="mbtn btn-main" id="fAdd">Добавить</button><button class="mbtn btn-sec" id="fCancel">Отмена</button></div>
</div></div>

  function voteApi(params){ return voteUrl + (voteUrl.indexOf('?') > -1 ? '&' : '?') + params + '&t=' + Date.now(); }
  async function loadLikes(){
    if(!voteUrl) return;
    try{

      if(r.ok){ likes = await r.json(); likesLoaded = true; }
    }catch(e){}
  }
  async function sendLike(item, on){
    try{
      var r = await fetch(voteApi('action=' + (on ? 'like' : 'unlike') + '&id=' + encodeURIComponent(item.id) + '&n=' + encodeURIComponent(item.name)), {signal: withTimeout(15000)});
      if(r.ok){ likes = await r.json(); likesLoaded = true; }
    }catch(e){}

  function likeBtn(item){
    var b = document.createElement('button'); b.className = 'like';
    // if the table was cleared (server count is 0), forget this device's old like
    if(likesLoaded && myLikes[item.id] && !(likes[item.id] > 0)){
      delete myLikes[item.id];
      try{ localStorage.setItem('banya_likes', JSON.stringify(myLikes)); }catch(e){}
    }
    b.textContent = (myLikes[item.id] ? '❤️' : '🤍') + ' ' + (likes[item.id] || 0);
    b.addEventListener('click', async function(){
      var on = !myLikes[item.id];
      if(on) myLikes[item.id] = true; else delete myLikes[item.id];
      likes[item.id] = Math.max(0, (likes[item.id] || 0) + (on ? 1 : -1));
      try{ localStorage.setItem('banya_likes', JSON.stringify(myLikes)); }catch(e){}
      render();
      await sendLike(item, on); render();
    });
    return b;
  }

  function line(label, text, cls){
    var d = document.createElement('div'); d.className = 'rline';
    var l = document.createElement('span'); l.className = 'rlabel' + (cls ? ' ' + cls : '');
    var sp = label.indexOf(' ');
    var first = sp > 0 ? label.slice(0, sp) : '';
    if(first && !/[A-Za-zА-Яа-яЁё]/.test(first)){
      var e = document.createElement('span'); e.className = 'emo' + (first.indexOf('🫖') === 0 ? ' calm' : '');
      e.textContent = first; l.appendChild(e); l.appendChild(document.createTextNode(' ' + label.slice(sp + 1) + ': '));
    } else { l.textContent = label + ': '; }
    d.appendChild(l); d.appendChild(document.createTextNode(text));
    return d;
  }
  function head(item){
    var f = document.createDocumentFragment();
    var nm = document.createElement('span'); nm.className = 'rname'; nm.textContent = item.name;
    var tg = document.createElement('span'); tg.className = 'rtag';
    var tk = TAGALIAS[item.tag] || item.tag; tg.style.color = TAGCOLOR[tk] || 'var(--tonus)'; tg.textContent = TAGLABEL[tk] || item.tag.toUpperCase();
    f.appendChild(nm); f.appendChild(tg);
    return f;
  }
  function icon(item){
    var b = document.createElement('div'); b.className = 'ic';

    else if(item.shape && SHAPES[item.shape]){ var im2 = document.createElement('img'); im2.alt = ''; im2.src = svgUri(SHAPES[item.shape].draw(), VB[item.shape]); b.appendChild(im2); }

  function editRow(item){
    var row = document.createElement('div');

    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !off[item.id];
    cb.addEventListener('change', function(){
      if(cb.checked) delete off[item.id]; else off[item.id] = true;
      row.classList.toggle('off', !cb.checked);
      setStatus('Есть несохранённые изменения');
    });
    var wrap = document.createElement('div'); wrap.className = 'tx';

      var del = document.createElement('a'); del.className = 'delcustom'; del.textContent = 'удалить этот пункт';
      del.addEventListener('click', function(){
        if(!confirm('Удалить «' + item.name + '» из меню?')) return;
        custom = custom.filter(function(c){ return c.id !== item.id; }); delete off[item.id]; rebuild();
        setStatus('Удалено. Нажмите «Сохранить для всех»'); render();
      });
      wrap.appendChild(del);

    row.appendChild(cb); row.appendChild(icon(item)); row.appendChild(wrap);

  function viewRow(item){
    var row = document.createElement('div'); row.className = 'row';

  var shapeTouched = false;

  function guessShape(name, cat){
    var n = (name || '').toLowerCase();
    if(/дуб/.test(n)) return 'oak';
    if(/клён|клен/.test(n)) return 'maple';
    if(/сосн|ель|ёлк|елк|пихт|можжев|кедр|лиственниц|хвой|туя/.test(n)) return 'needle';
    if(/эвкалипт/.test(n)) return 'round';
    if(/рябин|орех|ясен|акаци/.test(n)) return 'compound';
    if(/полын|тысячелист|пижм|укроп|чабрец|тимьян|хвощ|папорот/.test(n)) return 'feather';
    if(/ромашк|жасмин|чубушник|сирен|шиповник|календул|василь|цвет/.test(n)) return 'flower';
    if(/душиц|донник|иван|зверобо|лаванд|иссоп|чабер|багульник|бессмертник|золотарник/.test(n)) return 'spike';
    if(/шалфей|мят|мелисс|смородин/.test(n)) return 'leaf';
    if(/берёз|берез|ольх|осин|тополь/.test(n)) return 'serr';
    if(/лип|крапив|черёмух|черемух|вишн|малин/.test(n)) return 'heart';

    var name = $('fName').value.trim() || 'НАЗВАНИЕ';
    if(catVal() === 'veniki'){
      return 'Для банного меню напиши описание веника «' + name + '». Ответ строго в двух строках, кратко, без вступлений:\nАромат: <какой запах, одна короткая строка>\nДействие: <чем полезен для тела, кожи, дыхания; 1–2 строки; только подтверждённые традиционные сведения, без громких обещаний; обязательно предупреди о противопоказаниях или о том, что листья колючие или ядовитые, если это так>\n\nПример:\nАромат: хвойный, смолистый, насыщенный «лесной» дух\nДействие: мощный природный антисептик, бодрит и тонизирует; лист колючий — похлёстывать мягко, беречь лицо и глаза';
    }
    return 'Для банного меню напиши описание травы «' + name + '», которую запаривают в бане и вдыхают пар. Ответ строго в трёх строках, кратко, без вступлений:\nАромат: <какой запах, одна короткая строка>\nПар: <что даёт вдыхание пара в бане; если есть риски (головная боль, противопоказания) — укажи>\nОтвар: <что даёт при питье; если пить нельзя или опасно — так и напиши>\n\nПример:\nАромат: тёплый, пряно-цветочный, чуть медовый\nПар: смягчает кашель и першение, успокаивает, настраивает на сон\nОтвар: отхаркивающее действие, облегчает кашель изнутри';
  }
  function copyText(t, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = 'Скопировано ✓'; setTimeout(function(){ btn.textContent = o; }, 1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, function(){ fallback(); }); } else fallback();
    function fallback(){ var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ prompt('Скопируйте текст:', t); } document.body.removeChild(ta); }
  }
  function parseText(t){
    var out = {}, cur = null;
    String(t).split(/\r?\n/).forEach(function(raw){
      var l = raw.replace(/[*_`#>]/g, '').trim(); if(!l) return;
      var m = l.match(/^(?:[^A-Za-zА-Яа-яЁё0-9]+\s*)?(Аромат|Действие|Пар|Отвар)(?:\s*\([^)]*\))?\s*[:：\-—]\s*(.*)$/i);
      if(m){ cur = m[1].toLowerCase(); out[cur] = m[2].trim(); }
      else if(cur){ out[cur] = (out[cur] + ' ' + l).trim(); }
    });
    return out;
  }
  function addCard(){
    var d = document.createElement('div'); d.className = 'addcard';
    d.textContent = '➕ Добавить новый ' + (activeTab === 'veniki' ? 'веник' : 'траву');
    d.addEventListener('click', function(){ openAdd(activeTab); });
    return d;
  }
  var shSel = $('fShape');
  Object.keys(SHAPES).forEach(function(k){ var o = document.createElement('option'); o.value = k; o.textContent = SHAPES[k].label; shSel.appendChild(o); });
  TAGOPTS.forEach(function(t){ var o = document.createElement('option'); o.value = t[0]; o.textContent = t[1]; $('fTag').appendChild(o); });
  shSel.addEventListener('change', function(){ shapeTouched = true; updPrev(); });
  $('fName').addEventListener('input', autoShape);
  document.querySelectorAll('input[name=addCat]').forEach(function(r){ r.addEventListener('change', function(){ updFields(); autoShape(); }); });
  $('fCopy').addEventListener('click', function(){ copyText(buildPrompt(), this); });
  $('fParse').addEventListener('click', function(){
    var o = parseText($('fPaste').value);
    if(o['аромат']) $('fAroma').value = o['аромат'];
    if(o['действие']) $('fAction').value = o['действие'];
    if(o['пар']) $('fSteam').value = o['пар'];
    if(o['отвар']) $('fOtvar').value = o['отвар'];
  });
  $('fCancel').addEventListener('click', closeAdd);
  $('fAdd').addEventListener('click', function(){
    var cat = catVal(), name = $('fName').value.trim();
    if(!name){ alert('Введите название'); return; }
    var all = ITEMS.veniki.concat(ITEMS.travy);
    if(all.some(function(i){ return i.name.toLowerCase() === name.toLowerCase(); })){ alert('Такой пункт уже есть в меню'); return; }
    var p = cat === 'veniki' ? 'v' : 't';
    if(seq[p] >= 99){ alert('Достигнут предел количества пунктов'); return; }
    seq[p] += 1;
    var item = {id: p + seq[p], cat: cat, name: name, tag: $('fTag').value, shape: $('fShape').value, aroma: $('fAroma').value.trim()};
    if(cat === 'veniki') item.action = $('fAction').value.trim();
    else { item.steam = $('fSteam').value.trim(); item.otvar = $('fOtvar').value.trim(); }
    custom.push(item); rebuild(); closeAdd();
    setStatus('Добавлено. Нажмите «Сохранить для всех», чтобы гости увидели новый пункт');
    render();
  });


  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){ activeTab = t.dataset.tab; render(); });
  });
  $('toggleAll').addEventListener('click', function(){
    var cat = ITEMS[activeTab];
    var allOn = cat.every(function(i){ return !off[i.id]; });
    cat.forEach(function(i){ if(allOn) off[i.id] = true; else delete off[i.id]; });
    setStatus('Есть несохранённые изменения'); render();
  });
  $('previewBtn').addEventListener('click', function(){
    previewGuest = !previewGuest;
    this.textContent = previewGuest ? 'Назад к редактированию' : 'Как у гостя';
    render();
  });

  // ---------- editor login / logout ----------
  function askSecret(){
    return new Promise(function(resolve){
      $('lgLabel').textContent = useApi ? 'Пароль редактора' : 'Токен доступа (его вам дали для редактирования)';
      $('lgPass').value = '';
      $('loginModal').classList.add('show');
      setTimeout(function(){ $('lgPass').focus(); }, 50);
      function done(v){ $('loginModal').classList.remove('show'); $('lgOk').onclick = null; $('lgCancel').onclick = null; $('lgPass').onkeydown = null; resolve(v); }
      $('lgOk').onclick = function(){ done($('lgPass').value.trim()); };
      $('lgCancel').onclick = function(){ done(''); };
      $('lgPass').onkeydown = function(ev){ if(ev.key === 'Enter') done($('lgPass').value.trim()); };
    });
  }
  async function enterEditor(){
    if(useApi){
      if(!pw){ pw = await askSecret(); if(!pw) return; }
      setStatus('Проверяю пароль…');
      try{
        var r = await fetch(API_URL, {method:'POST', body: JSON.stringify({action:'check', password: pw}), signal: withTimeout(20000)});
        var j = await r.json();
        if(!j.ok) throw new Error(j.error === 'locked' ? 'слишком много неверных попыток, подождите 15 минут' : (j.error === 'unset' ? 'в Google-скрипте не задан пароль' : 'неверный пароль'));
        try{ localStorage.setItem('banya_pw', pw); }catch(e){}
        editor = true; setStatus(''); render();
      }catch(e){
        pw = ''; try{ localStorage.removeItem('banya_pw'); }catch(e2){}
        setStatus('Не удалось войти: ' + (e && e.name === 'AbortError' ? 'нет ответа' : (e.message || e)));
      }
      return;
    }
    if(!cfg){
      var rp = prompt('Адрес репозитория в формате  логин/название  (например: anna/banya):');
      if(!rp || rp.indexOf('/') < 1) return;
      cfg = {owner: rp.split('/')[0].trim(), repo: rp.split('/')[1].trim()};
      try{ localStorage.setItem('banya_repo', JSON.stringify(cfg)); }catch(e){}
    }
    if(!token){
      token = await askSecret();
      if(!token) return;
    }
    setStatus('Проверяю доступ…');
    try{
      await loadFromApi();
      try{ localStorage.setItem('banya_token', token); }catch(e){}
      editor = true; setStatus(''); render();
    }catch(e){
      token = '';
      try{ localStorage.removeItem('banya_token'); }catch(e2){}
      setStatus('Не удалось войти: ' + (e && e.message ? e.message : e));
    }
  }
  $('loginLink').addEventListener('click', enterEditor);
  $('voteCfgLink').addEventListener('click', function(){
    var v = prompt('Вставьте ссылку голосования (из Google Apps Script, заканчивается на /exec). Чтобы выключить сердечки — оставьте пустой:', voteUrl);
    if(v === null) return;
    voteUrl = v.trim();
    setStatus('Нажмите «Сохранить для всех», чтобы голосование заработало у гостей');
  });
  $('logoutBtn').addEventListener('click', async function(){
    try{ localStorage.removeItem('banya_token'); localStorage.removeItem('banya_pw'); }catch(e){}
    token = ''; pw = ''; editor = false; previewGuest = false; setStatus('');
    await loadPublic(); render(); loadLikes().then(render);
  });

  // ---------- saving ----------
  async function saveApi(btn){
    try{
      var r = await fetch(API_URL, {method:'POST', body: JSON.stringify({action:'save', password: pw, state: {off: Object.keys(off), custom: custom, seq: seq}}), signal: withTimeout(25000)});
      var j = await r.json();
      if(!j.ok) throw new Error(j.error === 'locked' ? 'слишком много неверных попыток' : (j.error === 'too_big' ? 'слишком много данных' : 'пароль не принят, войдите заново'));
      updatedAt = j.updatedAt || new Date().toISOString();
      setStatus('Сохранено. Гости увидят изменения после обновления страницы.');
      $('updatedAt').textContent = 'Отметьте галочками, что есть в наличии. ' + fmtDate(updatedAt);
    }catch(e){
      setStatus('Не удалось сохранить: ' + (e && e.name === 'AbortError' ? 'нет ответа, попробуйте ещё раз' : (e.message || e)));
    }
    btn.disabled = false; btn.textContent = 'Сохранить для всех';
  }
  $('saveBtn').addEventListener('click', async function(){
    var btn = this; btn.disabled = true; btn.textContent = 'Сохраняю…';
    if(useApi){ await saveApi(btn); return; }
    try{
      // fetch latest sha right before writing (in case another editor saved meanwhile)
      var r0 = await fetch(apiUrl() + '?t=' + Date.now(), {headers: apiHeaders(), cache:'no-store', signal: withTimeout(15000)});
      if(!r0.ok) throw new Error('не удалось прочитать файл (' + r0.status + ')');
      fileSha = (await r0.json()).sha;
      updatedAt = new Date().toISOString();
      var body = {message: 'update menu', content: b64enc(JSON.stringify({updatedAt: updatedAt, off: Object.keys(off), voteUrl: voteUrl, custom: custom, seq: seq}, null, 2)), sha: fileSha};
      var r = await fetch(apiUrl(), {method:'PUT', headers: apiHeaders(), body: JSON.stringify(body), signal: withTimeout(20000)});
      if(!r.ok) throw new Error('ошибка записи ' + r.status);
      fileSha = (await r.json()).content.sha;
      setStatus('Сохранено. У гостей обновится примерно через минуту.');
      $('updatedAt').textContent = 'Отметьте галочками, что есть в наличии. ' + fmtDate(updatedAt);
    }catch(e){
      setStatus('Не удалось сохранить: ' + (e && e.name === 'AbortError' ? 'нет ответа, попробуйте ещё раз' : (e.message || e)));
    }
    btn.disabled = false; btn.textContent = 'Сохранить для всех';
  });

  // ---------- start ----------
  (async function(){
    await loadPublic();
    render();
    loadLikes().then(render);
    if(useApi){ if(pw) await enterEditor(); } else if(token && cfg){ await enterEditor(); }   // auto-enter on devices that are already logged in
    if(location.hash === '#edit' && !editor) enterEditor();
  })();
})();
</script>
</body>
</html>
